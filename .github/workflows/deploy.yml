name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        script: |
          cd /home/ec2-user
          if [ -d "my-app" ]; then
            rm -rf my-app
          fi
          git clone https://github.com/IgorMiranda267/VotaFacil.git my-app
          cd my-app
          docker compose -f "docker-compose.yml" up -d --build 